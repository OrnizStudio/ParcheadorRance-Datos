# Pasa las pruebas de las reglas del robot cada vez que cambia en `main`.
name: Pruebas del robot

on:
  push:
    branches: [main]
    paths: ['robot/**', 'normas/**', '.github/workflows/pruebas-robot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # `-I`: sin la carpeta actual (la raíz del repositorio) en sys.path, para que un `unittest.py` o similar en
      # la raíz no se ejecute en lugar de las pruebas. `discover` añade solo robot/pruebas, que es del Propietario.
      - run: python3 -I -m unittest discover -s robot/pruebas -t robot/pruebas -v
