# Robot de permisos: comprueba cada propuesta (pull request) contra `main` y, si quien la hace tiene
# permiso para lo que cambia, la publica sola. Las reglas están en robot/permisos.py.
#
# Seguridad:
# - `pull_request_target` ejecuta SIEMPRE el robot que hay en `main`, nunca el de la propuesta, y es lo
#   que le da permiso para comentar y fusionar también cuando la propuesta viene de una copia (fork).
# - Por eso mismo aquí no se descarga ni se ejecuta código de la propuesta: el robot solo lee sus archivos
#   con git. No añadir pasos que hagan `checkout` de la propuesta ni que ejecuten nada suyo.
# - El nombre del trabajo `permisos` es la comprobación obligatoria de `main`: no cambiarlo sin cambiar
#   también la protección de la rama.
# - Lo único que se instala de fuera es BLAKE3 (robot/requisitos.txt), con versión y hash fijados, para
#   comprobar los paquetes de parche que se descargan (lista de archivos prohibidos, normas/). Se instala
#   con reintentos (robot/instalar.sh); si aun así falla, el robot avisa de que es un fallo temporal.
# - Python: nunca `python -m …` sin `-I` (pondría la raíz del `main` descargado en sys.path). `python robot/x.py`
#   sí vale: pone en sys.path solo `robot/`, que es del Propietario. Además, fuera de `catalogo/` todo es del
#   Propietario (permisos.py, CARPETA_CATALOGO), así que nadie más puede dejar código en la raíz.
name: Robot de permisos
# El nombre de cada ejecución: propuesta, acción y commit sobre el que se subió la cabeza. El robot lo lee para seguir
# quién subió cada commit (permisos.py, cuentas_de_la_propuesta): no cambiarlo sin cambiar NOMBRE_DE_EJECUCION.
run-name: "Robot de permisos · #${{ github.event.pull_request.number }} · ${{ github.event.action }} · antes ${{ github.event.before || 'ninguno' }}"

on:
  pull_request_target:
    branches: [main]
    # `edited`: también al cambiar la base de la propuesta (si no, se podría abrir contra otra rama, dejar en verde
    # un trabajo `permisos` propio y luego pasarla a `main` sin que este robot la mire).
    # `labeled`: las solicitudes (canal nuevo) se publican solo en la ejecución del evento en que el Dueño del programa
    # pone la etiqueta `aprobada` (robot/solicitudes.py); si la pone otra cuenta, el robot la quita.
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]

permissions: {}

# Que Python no deje `.pyc` en la copia de trabajo (`-I` ignora esta variable: ahí va `-B`).
env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: permisos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  permisos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Leer las ejecuciones del robot sobre la propuesta: quién ha subido cada cambio (cuentas_de_la_propuesta).
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar BLAKE3 (versión y hash fijados, con reintentos)
        id: instalar
        run: bash robot/instalar.sh "$RUNNER_TEMP/robot"
      # Si la instalación falla tras los reintentos (corte de red con PyPI), avisa en la propuesta de que
      # es un fallo temporal y no un rechazo. Usa el Python del sistema: esta parte no necesita BLAKE3.
      - name: Avisar del fallo temporal de instalación
        if: failure() && steps.instalar.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
        run: python robot/permisos.py --fallo-instalacion
      - name: Comprobar la propuesta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_ACTOR: ${{ github.event.sender.login }}
          PR_ACTOR_ID: ${{ github.event.sender.id }}
          # El commit del evento (si la propuesta ya tiene otro, el robot para) y quien lanza esta ejecución (distinto
          # de `sender` al relanzarla): también cuenta para el rol más bajo.
          PR_CABEZA: ${{ github.event.pull_request.head.sha }}
          PR_DISPARADOR: ${{ github.triggering_actor }}
          # opened/synchronize: quien lanza es quien ha subido la cabeza; si no, el robot busca quién la subió.
          PR_ACCION: ${{ github.event.action }}
          # labeled: la etiqueta que se acaba de poner (quien la pone es `PR_ACTOR_ID`).
          PR_ETIQUETA: ${{ github.event.label.name }}
          # synchronize: el commit sobre el que se ha subido la cabeza (el robot tiene que haberlo visto subir).
          PR_ANTES: ${{ github.event.before }}
        run: '"$RUNNER_TEMP/robot/bin/python" robot/permisos.py'

  fusionar:
    needs: permisos
    runs-on: ubuntu-latest
    # Una sola publicación a la vez en todo el repositorio: cada una vuelve a comprobar contra el `main` de ese
    # instante y, justo antes de fusionar, confirma que `main` no se ha movido (si se ha movido, no publica y lo dice).
    # Ojo: GitHub solo deja una en espera por grupo; si llegan varias a la vez, las de en medio se cancelan y hay que
    # volver a lanzarlas (o subir cualquier cambio a la propuesta).
    concurrency:
      group: fusionar-datos
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # Leer las ejecuciones del robot sobre la propuesta: quién ha subido cada cambio (cuentas_de_la_propuesta).
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar BLAKE3 (versión y hash fijados, con reintentos)
        id: instalar
        run: bash robot/instalar.sh "$RUNNER_TEMP/robot"
      # Si la instalación falla tras los reintentos (corte de red con PyPI), avisa en la propuesta de que
      # es un fallo temporal y no un rechazo. Usa el Python del sistema: esta parte no necesita BLAKE3.
      - name: Avisar del fallo temporal de instalación
        if: failure() && steps.instalar.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
        run: python robot/permisos.py --fallo-instalacion --fusionar
      # Vuelve a comprobarla contra el `main` de este instante (por si otra propuesta se ha publicado
      # mientras tanto) y, si sigue pasando, la fusiona.
      - name: Volver a comprobar y publicar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_ACTOR: ${{ github.event.sender.login }}
          PR_ACTOR_ID: ${{ github.event.sender.id }}
          # El commit del evento (si la propuesta ya tiene otro, el robot para) y quien lanza esta ejecución (distinto
          # de `sender` al relanzarla): también cuenta para el rol más bajo.
          PR_CABEZA: ${{ github.event.pull_request.head.sha }}
          PR_DISPARADOR: ${{ github.triggering_actor }}
          # opened/synchronize: quien lanza es quien ha subido la cabeza; si no, el robot busca quién la subió.
          PR_ACCION: ${{ github.event.action }}
          # labeled: la etiqueta que se acaba de poner (quien la pone es `PR_ACTOR_ID`).
          PR_ETIQUETA: ${{ github.event.label.name }}
          # synchronize: el commit sobre el que se ha subido la cabeza (el robot tiene que haberlo visto subir).
          PR_ANTES: ${{ github.event.before }}
        run: '"$RUNNER_TEMP/robot/bin/python" robot/permisos.py --fusionar'

  # Fase B: tras publicar una propuesta, regenera `catalogo/catalogo.json` (para las ≤0.2.x) y escribe la rama
  # `publicado` (robot/publicar.py). Lo que el robot fusiona con el token de Actions no lanza otros flujos, así que va
  # aquí detrás. Solo lee `main`; no ejecuta nada de la propuesta.
  publicar:
    needs: fusionar
    runs-on: ubuntu-latest
    concurrency:
      group: publicar-datos
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # La comprobación `permisos` en verde de la propuesta del catálogo regenerado (sale entera de `main`).
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar el catálogo y escribir la rama publicado
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python robot/publicar.py
