# Robot de permisos: comprueba cada propuesta (pull request) contra `main` y, si quien la hace tiene
# permiso para lo que cambia, la publica sola. Las reglas están en robot/permisos.py.
#
# Seguridad:
# - `pull_request_target` ejecuta SIEMPRE el robot que hay en `main`, nunca el de la propuesta, y es lo
#   que le da permiso para comentar y fusionar también cuando la propuesta viene de una copia (fork).
# - Por eso mismo aquí no se descarga ni se ejecuta código de la propuesta: el robot solo lee sus archivos
#   con git. No añadir pasos que hagan `checkout` de la propuesta ni que ejecuten nada suyo.
# - El nombre del trabajo `permisos` es la comprobación obligatoria de `main`: no cambiarlo sin cambiar
#   también la protección de la rama.
# - Lo único que se instala de fuera es BLAKE3 (robot/requisitos.txt), con versión y hash fijados, para
#   comprobar los paquetes de parche que se descargan (lista de archivos prohibidos, normas/).
name: Robot de permisos

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: permisos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  permisos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar BLAKE3 (versión y hash fijados)
        run: |
          python -m venv "$RUNNER_TEMP/robot"
          "$RUNNER_TEMP/robot/bin/pip" install --quiet --no-deps --only-binary :all: --require-hashes -r robot/requisitos.txt
      - name: Comprobar la propuesta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_ACTOR: ${{ github.event.sender.login }}
        run: '"$RUNNER_TEMP/robot/bin/python" robot/permisos.py'

  fusionar:
    needs: permisos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar BLAKE3 (versión y hash fijados)
        run: |
          python -m venv "$RUNNER_TEMP/robot"
          "$RUNNER_TEMP/robot/bin/pip" install --quiet --no-deps --only-binary :all: --require-hashes -r robot/requisitos.txt
      # Vuelve a comprobarla contra el `main` de este instante (por si otra propuesta se ha publicado
      # mientras tanto) y, si sigue pasando, la fusiona.
      - name: Volver a comprobar y publicar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_ACTOR: ${{ github.event.sender.login }}
        run: '"$RUNNER_TEMP/robot/bin/python" robot/permisos.py --fusionar'
